<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/CSS/index.css" rel="stylesheet" type="text/css"/>
    <script src = "/JS/index.js" defer></script>
    <title>Login</title>
</head>
<body>
    <div id="container-login-form" class="">
        <form id="login-form" name="login">
            <h2>LOGIN</h2>
            <div>
                <label for="inp-email">Correo:</label>
                <input id="inp-email" name="email">
            </div>
            <div>
                <label for="inp-password">Contraseña:</label>
                <input id="inp-password" name="password">
            </div>
            <button type="submit">Enviar</button>
        </form>
        <a href="#" id="a-register">Registrarse</a>
        <div class="div-error"></div>
    </div>
    <div id="container-register-form" class="div-hidden">
        <form id="register-form" name="register">
            <h2>REGISTRO</h2>
            <div>
                <label for="inp-email">Correo:</label>
                <input id="inp-email" name="email">
            </div>
            <div>
                <label for="inp-password">Contraseña:</label>
                <input id="inp-password" name="password">
            </div>
            <button type="submit">Enviar</button>
        </form>
        <a href="#" id="a-login">Inicia Sesion</a>
        <div class="div-error"></div>
    </div>
</body>
</html>
